<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- Core Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Inner Prism Crystal Gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#c4b5fd" />
      <stop offset="70%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Multi-Layer Glow Filters -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="43" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Sheen -->
  <path d="M 1 44 Q 1 1 44 1 L 148 1 Q 191 1 191 44 L 191 80 Q 96 110 1 80 Z" fill="url(#glassReflect)" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="96" cy="98" r="48" fill="url(#neonGrad)" opacity="0.25" filter="url(#superGlow)" />

  <!-- The AXIOM Cyber-Prism 'A' Monogram -->
  <g filter="url(#superGlow)">
    <!-- Outer Quantum Prism Legs -->
    <path d="M 96 28 
             L 154 148 
             L 126 148 
             L 108 110 
             L 84 110 
             L 66 148 
             L 38 148 
             Z" 
          fill="url(#neonGrad)" />

    <!-- Inner Hollow Triangle (Aperture) -->
    <polygon points="96,56 76,95 116,95" fill="#0c0e14" />
  </g>

  <!-- Sharp Core Crystal Overlay with Filter -->
  <g filter="url(#intenseGlow)">
    <!-- Left Neon Edge -->
    <path d="M 96 28 L 38 148 L 52 148 L 96 52 Z" fill="#00f0ff" opacity="0.95" />

    <!-- Right Neon Edge -->
    <path d="M 96 28 L 154 148 L 140 148 L 96 52 Z" fill="#ec4899" opacity="0.9" />

    <!-- Center Crossbar Horizon Bridge -->
    <path d="M 72 100 L 120 100 L 115 110 L 77 110 Z" fill="url(#crystalGrad)" />

    <!-- Apex Quantum Sparkle Core -->
    <circle cx="96" cy="40" r="5.5" fill="#ffffff" />
    <path d="M 96 24 L 98 40 L 112 40 L 99 42 L 104 56 L 96 44 L 88 56 L 93 42 L 80 40 L 94 40 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Glowing Central Node -->
  <circle cx="96" cy="80" r="3.5" fill="#00f0ff" filter="url(#intenseGlow)" />
</svg>
