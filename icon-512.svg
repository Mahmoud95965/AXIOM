<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1f24" />
      <stop offset="100%" stop-color="#0e1013" />
    </radialGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="30%" stop-color="#9b51e0" />
      <stop offset="70%" stop-color="#ea4335" />
      <stop offset="100%" stop-color="#fbbc05" />
    </linearGradient>
    <linearGradient id="axiomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8c7fa" />
      <stop offset="45%" stop-color="#d3e3fd" />
      <stop offset="80%" stop-color="#c58af9" />
      <stop offset="100%" stop-color="#f8a8d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Aurora Glow Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#auroraGrad)" stroke-width="1.5" opacity="0.3" filter="url(#glow)" />

  <!-- AXIOM Gemini Sparkle Star Shape -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Primary 4-pointed Sparkle -->
    <path d="M 256 64 
             C 256 168, 168 256, 64 256 
             C 168 256, 256 344, 256 448 
             C 256 344, 344 256, 448 256 
             C 344 256, 256 168, 256 64 Z" 
          fill="url(#auroraGrad)" />

    <!-- Inner Core Sparkle for depth and brilliance -->
    <path d="M 256 120 
             C 256 195, 195 256, 120 256 
             C 195 256, 256 317, 256 392 
             C 256 317, 317 256, 392 256 
             C 317 256, 256 195, 256 120 Z" 
          fill="url(#axiomGrad)" opacity="0.9" />

    <!-- Center Bright Spot -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.95" filter="url(#glow)" />
  </g>

  <!-- Secondary mini-sparkle -->
  <path d="M 380 90 
           C 380 115, 360 135, 335 135 
           C 360 135, 380 155, 380 180 
           C 380 155, 400 135, 425 135 
           C 400 135, 380 115, 380 90 Z" 
        fill="url(#axiomGrad)" opacity="0.85" filter="url(#glow)" />
</svg>
